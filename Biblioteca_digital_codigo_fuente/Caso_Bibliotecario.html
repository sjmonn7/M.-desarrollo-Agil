<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Biblioteca Digital · Bibliotecario</title>
<style>
:root{--red:#c62032;--ink:#172338;--muted:#586579;--line:#dce2e9;--bg:#f4f6fa;--green:#16664c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Segoe UI',Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 17px;font-weight:600;background:var(--red);color:white}button:hover{filter:brightness(.92)}button.secondary{background:#eaf0f6;color:var(--ink)}button.danger{background:#fff0f0;color:#a31226}button:disabled{cursor:not-allowed;opacity:.45}input,select{display:block;width:100%;border:1px solid #abb8c8;border-radius:7px;padding:10px;background:white;color:var(--ink)}label{display:block;font-weight:600;margin-bottom:5px}input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid #498ccc;outline-offset:2px}h1{font-size:30px;line-height:1.2;margin:0 0 10px}h2{font-size:20px;margin:0 0 16px}h3{font-size:17px;margin:0 0 6px}p{margin:6px 0 18px}.muted{color:var(--muted)}.tiny{font-size:12px}.top{height:74px;padding:0 32px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:24px;font-weight:850;color:var(--red);letter-spacing:-1px}.brand span{border-left:1px solid var(--line);margin-left:18px;padding-left:18px;color:var(--ink);font-size:17px;font-weight:600;letter-spacing:0}.badge{font-size:12px;border-radius:30px;padding:5px 10px;background:#e7f3ec;color:var(--green);display:inline-block;font-weight:700}.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 111px)}aside{background:white;padding:26px 18px;border-right:1px solid var(--line)}nav button{display:block;text-align:left;background:transparent;color:var(--muted);width:100%;margin-bottom:7px}nav button.active{background:#fbe9eb;color:#a91627}.profile{padding:4px 14px 24px}.profile b{display:block}main{padding:32px;max-width:1440px;width:100%}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:24px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:7px}.card p{margin:0}.card button{margin-top:auto}.bookicon{height:64px;width:48px;border-radius:3px 8px 8px 3px;background:#233d59;border-left:5px solid #6585a3;color:white;display:grid;place-items:center;font-size:24px;margin-bottom:9px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:14px;align-items:end}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin-bottom:16px}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;background:#f4f6fa;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#526176}td,th{padding:13px 11px;border-bottom:1px solid var(--line)}.scroll{overflow:auto}.notice{padding:12px 18px;background:#fff5de;border-bottom:1px solid #ecd4a4;font-size:12px;text-align:center}.login{max-width:1000px;display:grid;grid-template-columns:1fr 1fr;margin:65px auto;gap:60px;padding:20px}.login .pitch{padding-top:30px}.pitch h1{font-size:44px}.pitch .line{width:50px;height:5px;background:var(--red);margin:25px 0}.metric strong{font-size:34px;display:block}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:16px 24px;border:1px solid #b7d9c7;background:#edf8f1;box-shadow:0 8px 25px #17233822;border-radius:10px;z-index:50;max-width:90vw}.toast.error{background:#fff0ef;border-color:#e5b9b5}dialog{border:0;border-radius:14px;width:min(620px,94vw);padding:28px;box-shadow:0 20px 80px #0004}dialog::backdrop{background:#16253888}.empty{padding:35px;text-align:center;color:var(--muted)}footer{font-size:12px;color:var(--muted);padding:18px 0}.tag{font-size:12px;font-weight:600;color:#a21a2a}.help li{margin-bottom:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{border:0;padding:12px}.profile{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}main{padding:20px}.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.login{margin:20px auto;gap:20px}.pitch h1{font-size:32px}.top{padding:0 18px}.brand span{display:none}}@media(max-width:560px){.login,.grid,.formgrid,.filters{grid-template-columns:1fr}.login .pitch{display:none}.pagehead{align-items:start;flex-direction:column}h1{font-size:26px}}@media print{aside,.top,.notice,button,footer{display:none!important}.layout{display:block}main{padding:0}.panel{border:0}}
</style></head><body><div class="notice">Prototipo académico local · Datos ficticios · La información se conserva solo mientras esta pestaña permanezca abierta.</div><div id="root"></div><dialog id="modal"></dialog><div id="feedback" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEMO='BibliotecaDemo2026!',roles=['Estudiante','Bibliotecario','Administrador'];
const db={users:[],books:[{id:1,title:'Ingeniería de software',author:'Ian Sommerville',category:'Informática',copies:3,active:true},{id:2,title:'Clean Code',author:'Robert C. Martin',category:'Informática',copies:2,active:true},{id:3,title:'Scrum y desarrollo ágil',author:'Colección académica de demostración',category:'Gestión',copies:1,active:true},{id:4,title:'Fundamentos de bases de datos',author:'Abraham Silberschatz',category:'Informática',copies:2,active:true},{id:5,title:'Diseño de interfaces',author:'Colección académica de demostración',category:'Diseño',copies:2,active:true},{id:6,title:'Introducción a la administración',author:'Colección académica de demostración',category:'Gestión',copies:1,active:true}],loans:[],reservations:[],notes:[],audit:[]};
let session=null,view='catalog',seq=100,lastActivity=Date.now(),filters={q:'',category:'',availability:''};const attempts={};
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},book=id=>db.books.find(b=>b.id===id),user=id=>db.users.find(u=>u.id===id),uid=()=>++seq;
function available(id){return book(id).copies-db.loans.filter(l=>l.book===id&&!l.returned).length-db.reservations.filter(r=>r.book===id&&r.status==='Lista para retiro').length}
function log(event){db.audit.push({date:new Date().toLocaleString('es-CL'),actor:session?.email||'Acceso',event})}
function tell(message,error=false){$('#feedback').innerHTML='<div class="toast '+(error?'error':'')+'">'+esc(message)+'</div>';clearTimeout(tell.timer);tell.timer=setTimeout(()=>$('#feedback').innerHTML='',6500)}
function allow(...r){if(!session||!r.includes(session.role)){tell('Acceso denegado para este perfil.',true);log('Operación denegada');return false}return true}
function notify(id,message){db.notes.unshift({id:uid(),user:id,message,date:day(0)})}
async function hash(password,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},key,256);return Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,'0')).join('')}
const PASSWORD_MAX_DAYS=90;
const PASSWORD_HELP='De 8 a 128 caracteres, con mayúscula, minúscula, número y símbolo. Sin patrones comunes, nombre, correo o perfil. No reutilices las últimas 3 claves (incluida la actual). Cambio obligatorio cada '+PASSWORD_MAX_DAYS+' días.';
const normalized=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
async function credential(u,p){u.salt=crypto.randomUUID();u.hash=await hash(p,u.salt);u.passwordHistory=[{salt:u.salt,hash:u.hash},...(u.passwordHistory||[])].slice(0,3);u.passwordChangedAt=Date.now()}
async function passwordError(p,u){
 if(p.length<8||p.length>128)return 'Contraseña débil: debe tener entre 8 y 128 caracteres.';
 if(!/[A-ZÁÉÍÓÚÑÜ]/.test(p)||!/[a-záéíóúñü]/.test(p)||!/[0-9]/.test(p)||! /[^\p{L}\p{N}\s]/u.test(p))return 'Contraseña débil: incluye mayúscula, minúscula, número y símbolo.';
 const v=normalized(p);
 if(['1234','4321','9876','qwerty','asdf','abcd','password','contrasena'].some(x=>v.includes(x))||/(.)\1{3}/u.test(v)||p===DEMO)return 'Contraseña débil: evita patrones comunes, repeticiones y la clave pública de demostración.';
 const personal=[...normalized(u.name).split(/[^a-z0-9]+/),...normalized((u.email||'').split('@')[0]).split(/[^a-z0-9]+/),'administrador','administradora','admin','alumno','alumna','estudiante','bibliotecario','bibliotecaria'];
 if(personal.some(x=>x.length>=3&&v.includes(x)))return 'No incluyas tu nombre, usuario del correo ni nombres de perfiles en la contraseña.';
 for(const previous of u.passwordHistory||[]){if(await hash(p,previous.salt)===previous.hash)return 'No puedes reutilizar ninguna de tus últimas 3 contraseñas (incluida la actual).'}
 return '';
}
function passwordExpired(u){return Date.now()-(u.passwordChangedAt||0)>=PASSWORD_MAX_DAYS*86400000}

function headerBar(){return '<header class="top"><div class="brand">INACAP<span>Biblioteca Digital</span></div><span class="badge">'+(session?esc(session.role):'Acceso institucional')+'</span></header>'}
function login(){session=null;$('#root').innerHTML=headerBar()+`<div class="login"><section class="pitch"><span class="tag">TU BIBLIOTECA, MÁS CERCA</span><h1>El conocimiento<br>comienza aquí.</h1><div class="line"></div><p class="muted">Explora el catálogo, reserva tu próximo libro y lleva tus préstamos al día.</p><div class="panel tiny"><b>Cuentas de demostración</b><p>estudiante@demo.cl<br>bibliotecario@demo.cl<br>administrador@demo.cl</p><b>Contraseña común:</b> BibliotecaDemo2026!<p>Son credenciales públicas y ficticias. No ingreses datos personales reales.</p></div></section><section class="panel"><h2>Acceso Bibliotecario</h2><p class="muted">Ingresa con la cuenta de tu perfil.</p><form id="loginform"><div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required value="bibliotecario@demo.cl"></div><div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required value="BibliotecaDemo2026!"></div><button style="width:100%" id="enter">Ingresar</button></form><p class="tiny muted" style="margin-top:20px">Cinco intentos fallidos bloquean la cuenta durante 60 segundos en esta demostración. Para restablecer tu contraseña, solicita ayuda al administrador.</p></section></div>`;$('#loginform').onsubmit=async e=>{e.preventDefault();const email=$('#email').value.trim().toLowerCase(),p=$('#password').value;const a=attempts[email]||{n:0,until:0};if(a.until>Date.now())return tell('Acceso temporalmente bloqueado. Intenta nuevamente en '+Math.ceil((a.until-Date.now())/1000)+' segundos.',true);if(a.until&&a.until<=Date.now()){a.n=0;a.until=0}$('#enter').disabled=true;const u=db.users.find(x=>x.email===email);const valid=u&&await hash(p,u.salt)===u.hash;if(!valid||!u.active){a.n++;if(a.n>=5){a.until=Date.now()+60000;log('Bloqueo temporal de acceso')}attempts[email]=a;$('#enter').disabled=false;return tell(a.n>=5?'Acceso temporalmente bloqueado por 60 segundos.':'No fue posible iniciar sesión. Revisa tus credenciales.',true)}delete attempts[email];session=u;if(passwordExpired(u))u.forceChange=true;lastActivity=Date.now();view=u.role==='Estudiante'?'catalog':u.role==='Bibliotecario'?'desk':'users';log('Inicio de sesión');render()}}
const menu={Estudiante:[['catalog','Catálogo'],['mine','Mis préstamos y reservas'],['notes','Notificaciones'],['password','Mi contraseña'],['help','Ayuda']],Bibliotecario:[['desk','Préstamos y devoluciones'],['catalog','Catálogo'],['manage','Mantener catálogo'],['password','Mi contraseña'],['help','Ayuda']],Administrador:[['users','Usuarios y perfiles'],['reports','Reportes de uso'],['security','Seguridad y auditoría'],['password','Mi contraseña'],['help','Ayuda']]};
function render(){if(!session)return login();if(passwordExpired(session))session.forceChange=true;if(session.forceChange)view='password';const allowed=menu[session.role].map(x=>x[0]);if(!allowed.includes(view)){tell('Vista no autorizada.',true);view=allowed[0]}$('#root').innerHTML=headerBar()+`<div class="layout"><aside><div class="profile"><span class="muted tiny">SESIÓN ACTIVA</span><b>${esc(session.name)}</b><span class="tiny muted">${esc(session.email)}</span></div><nav>${menu[session.role].map(([id,label])=>`<button data-view="${id}" class="${view===id?'active':''}">${label}</button>`).join('')}<button id="logout">Cerrar sesión</button></nav></aside><main id="main"></main></div>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('#logout').onclick=()=>{log('Cierre de sesión');login()};({catalog,desk,manage,mine,notes,users,reports,security,password,help}[view])();$('#main').insertAdjacentHTML('beforeend','<footer>Biblioteca Digital INACAP · Evaluación 4 · Prototipo de validación, sin conexión a sistemas institucionales.</footer>')}
function heading(title,subtitle,extra=''){return `<div class="pagehead"><div><h1>${title}</h1><p class="muted">${subtitle}</p></div>${extra}</div>`}
function catalog(){if(!allow('Estudiante','Bibliotecario'))return;$('#main').innerHTML=heading('Encuentra tu próxima lectura','Busca por título o autor y filtra según tus necesidades.')+`<form class="panel filters" id="search"><div><label for="query">Título o autor</label><input id="query" value="${esc(filters.q)}" placeholder="¿Qué estás buscando?"></div><div><label for="category">Categoría</label><select id="category"><option value="">Todas</option>${['Informática','Gestión','Diseño'].map(x=>`<option ${filters.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="availability">Disponibilidad</label><select id="availability"><option value="">Todos los materiales</option><option value="yes" ${filters.availability?'selected':''}>Disponible ahora</option></select></div><button>Buscar</button></form><div class="grid" id="books"></div>`;const q=filters.q.toLocaleLowerCase('es');const items=db.books.filter(b=>b.active&&(!q||(b.title+' '+b.author).toLocaleLowerCase('es').includes(q))&&(!filters.category||b.category===filters.category)&&(!filters.availability||available(b.id)>0));$('#books').innerHTML=items.length?items.map(b=>`<article class="card"><div class="bookicon" aria-hidden="true">▤</div><span class="tag">${esc(b.category)}</span><h3>${esc(b.title)}</h3><p class="muted">${esc(b.author)}</p><p><span class="badge">${available(b.id)} disponibles de ${b.copies}</span></p><p class="tiny muted">Código de material: M${b.id}</p>${session.role==='Estudiante'?`<button data-reserve="${b.id}">${available(b.id)>0?'Reservar material':'Unirme a la espera'}</button>`:''}</article>`).join(''):'<div class="panel empty">No encontramos materiales. Prueba otro título o elimina los filtros.</div>';$('#search').onsubmit=e=>{e.preventDefault();filters={q:$('#query').value.trim(),category:$('#category').value,availability:$('#availability').value};catalog()};document.querySelectorAll('[data-reserve]').forEach(b=>b.onclick=()=>reserve(+b.dataset.reserve))}
function reserve(id){if(!allow('Estudiante'))return;if(db.reservations.some(r=>r.user===session.id&&r.book===id&&['Lista para retiro','En espera'].includes(r.status)))return tell('Ya tienes una reserva activa de este material.',true);if(db.loans.some(l=>l.user===session.id&&l.book===id&&!l.returned))return tell('Ya tienes este material en préstamo.',true);const status=available(id)>0?'Lista para retiro':'En espera';db.reservations.push({id:uid(),book:id,user:session.id,status,date:day(0)});notify(session.id,`Reserva de ${book(id).title}: ${status}.`);log('Reserva M'+id);view='mine';render();tell('Reserva registrada: '+status+'.')}
function table(headers,rows){return '<div class="scroll"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function mine(){if(!allow('Estudiante'))return;const ls=db.loans.filter(l=>l.user===session.id),rs=db.reservations.filter(r=>r.user===session.id);$('#main').innerHTML=heading('Mis préstamos y reservas','Consulta tus vencimientos y el estado de tus solicitudes.')+'<section class="panel"><h2>Préstamos</h2>'+table(['Material','Vencimiento','Estado'],ls.map(l=>`<tr><td>${esc(book(l.book).title)}</td><td>${l.due}</td><td>${l.returned?'Devuelto':l.due<day(0)?'Atrasado':'Vigente'}</td></tr>`))+(ls.length?'':'<p class="empty">Aún no tienes préstamos.</p>')+'</section><section class="panel"><h2>Reservas</h2>'+table(['Material','Solicitud','Estado'],rs.map(r=>`<tr><td>${esc(book(r.book).title)}</td><td>${r.date}</td><td><span class="badge">${r.status}</span></td></tr>`))+(rs.length?'':'<p class="empty">Reserva tu primer material desde el catálogo.</p>')+'</section>'}
function desk(){if(!allow('Bibliotecario'))return;const pending=db.reservations.filter(r=>['Lista para retiro','En espera'].includes(r.status)),ls=db.loans.filter(l=>!l.returned);$('#main').innerHTML=heading('Préstamos y devoluciones','Valida solicitudes, entrega materiales y registra su devolución.','<button id="direct">Registrar préstamo</button>')+'<section class="panel"><h2>Reservas por atender</h2>'+table(['Estudiante','Material','Estado','Acción'],pending.map(r=>`<tr><td>${esc(user(r.user).name)}</td><td>${esc(book(r.book).title)}</td><td>${r.status}</td><td><button data-deliver="${r.id}" ${r.status==='En espera'?'disabled':''}>Validar y prestar</button></td></tr>`))+(pending.length?'':'<p class="empty">No hay reservas pendientes.</p>')+'</section><section class="panel"><h2>Préstamos activos</h2>'+table(['Estudiante','Material','Vencimiento','Acción'],ls.map(l=>`<tr><td>${esc(user(l.user).name)}</td><td>${esc(book(l.book).title)}</td><td>${l.due}</td><td><button class="secondary" data-return="${l.id}">Devolver</button></td></tr>`))+'</section>';$('#direct').onclick=()=>loanDialog();document.querySelectorAll('[data-deliver]').forEach(b=>b.onclick=()=>lend(+b.dataset.deliver));document.querySelectorAll('[data-return]').forEach(b=>b.onclick=()=>returnLoan(+b.dataset.return))}
function modal(title,content,onSubmit){$('#modal').innerHTML=`<h2>${title}</h2><form id="modalform">${content}<div class="actions"><button>Guardar</button><button type="button" class="secondary" id="cancel">Cancelar</button></div></form>`;$('#cancel').onclick=()=>$('#modal').close();$('#modalform').onsubmit=e=>{e.preventDefault();onSubmit()};$('#modal').showModal()}
function loanDialog(){modal('Registrar préstamo',`<div class="field"><label for="student">Estudiante</label><select id="student">${db.users.filter(u=>u.role==='Estudiante'&&u.active).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`)}</select></div><div class="field"><label for="material">Material disponible</label><select id="material">${db.books.filter(b=>b.active&&available(b.id)>0).map(b=>`<option value="${b.id}">${esc(b.title)}</option>`)}</select></div><p class="muted">Plazo de demostración: 14 días. Máximo: 3 préstamos vigentes.</p>`,()=>{if(lend(null,+$('#student').value,+$('#material').value))$('#modal').close()})}
function lend(reservation,id,material){if(!allow('Bibliotecario'))return false;const r=reservation&&db.reservations.find(r=>r.id===reservation);if(reservation&&(!r||r.status!=='Lista para retiro'))return false;if(r){id=r.user;material=r.book}const u=user(id),b=book(material);if(!u?.active||!b?.active||(!r&&available(material)<1)){tell('No se puede prestar: revisa usuario y disponibilidad.',true);return false}const active=db.loans.filter(l=>l.user===id&&!l.returned);if(active.length>=3||active.some(l=>l.book===material)){tell('Límite alcanzado o préstamo duplicado.',true);return false}if(!r&&db.reservations.some(x=>x.user===id&&x.book===material&&['En espera','Lista para retiro'].includes(x.status))){tell('Este usuario tiene una reserva; valídala desde la lista.',true);return false}db.loans.push({id:uid(),user:id,book:material,date:day(0),due:day(14),returned:null});if(r)r.status='Retirada';notify(id,'Préstamo de '+b.title+'. Devuelve antes del '+day(14)+'.');log('Préstamo M'+material);render();tell('Préstamo registrado. Vencimiento: '+day(14));return true}
function returnLoan(id){if(!allow('Bibliotecario'))return;const l=db.loans.find(l=>l.id===id);if(!l||l.returned)return;l.returned=day(0);notify(l.user,'Devolución registrada: '+book(l.book).title);const wait=db.reservations.find(r=>r.book===l.book&&r.status==='En espera');if(wait){wait.status='Lista para retiro';notify(wait.user,'Tu reserva ya está lista para retiro: '+book(l.book).title)}log('Devolución M'+l.book);render();tell('Devolución registrada y disponibilidad actualizada.')}
function notes(){if(!allow('Estudiante'))return;const ns=db.notes.filter(n=>n.user===session.id);$('#main').innerHTML=heading('Notificaciones','Avisos internos de tus reservas, préstamos y devoluciones.')+ns.map(n=>`<article class="panel"><span class="tiny muted">${n.date}</span><p>${esc(n.message)}</p></article>`).join('')+(ns.length?'':'<div class="panel empty">No tienes avisos nuevos.</div>')+'<p class="tiny muted">Los correos institucionales y el envío diario de recordatorios se integrarán en producción.</p>'}
function manage(){if(!allow('Bibliotecario'))return;$('#main').innerHTML=heading('Mantener catálogo','Agrega materiales, corrige sus datos o retíralos de circulación.','<button id="addbook">Agregar material</button>')+'<div class="panel">'+table(['Material','Categoría','Copias','Estado','Acciones'],db.books.map(b=>`<tr><td>${esc(b.title)}</td><td>${esc(b.category)}</td><td>${b.copies}</td><td>${b.active?'Activo':'Dado de baja'}</td><td><div class="actions"><button class="secondary" data-editbook="${b.id}">Editar</button><button class="danger" data-togglebook="${b.id}">${b.active?'Dar de baja':'Activar'}</button></div></td></tr>`))+'</div>';$('#addbook').onclick=()=>editBook();document.querySelectorAll('[data-editbook]').forEach(b=>b.onclick=()=>editBook(+b.dataset.editbook));document.querySelectorAll('[data-togglebook]').forEach(b=>b.onclick=()=>{if(!allow('Bibliotecario'))return;const x=book(+b.dataset.togglebook);if(x.active&&(db.loans.some(l=>l.book===x.id&&!l.returned)||db.reservations.some(r=>r.book===x.id&&['En espera','Lista para retiro'].includes(r.status))))return tell('No se puede dar de baja un material con compromisos activos.',true);x.active=!x.active;log('Cambio de estado M'+x.id);render()})}
function editBook(id){const b=id?book(id):{title:'',author:'',category:'Informática',copies:1};modal(id?'Editar material':'Agregar material',`<div class="field"><label for="title">Título</label><input id="title" required maxlength="100" value="${esc(b.title)}"></div><div class="field"><label for="author">Autor</label><input id="author" required maxlength="90" value="${esc(b.author)}"></div><div class="formgrid"><div class="field"><label for="cat">Categoría</label><select id="cat">${['Informática','Gestión','Diseño'].map(x=>`<option ${x===b.category?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="copies">Copias</label><input id="copies" type="number" min="1" max="100" required value="${b.copies}"></div></div>`,()=>{if(!allow('Bibliotecario'))return;const count=+$('#copies').value;if(id&&count<b.copies-available(id))return tell('No reduzcas las copias por debajo de los préstamos y reservas vigentes.',true);if(!$('#title').value.trim()||!$('#author').value.trim())return tell('Completa título y autor.',true);Object.assign(b,{title:$('#title').value.trim(),author:$('#author').value.trim(),category:$('#cat').value,copies:count});if(!id){b.id=uid();b.active=true;db.books.push(b)}log('Catálogo actualizado M'+b.id);$('#modal').close();render();tell('Material guardado.')})}
function users(){if(!allow('Administrador'))return;$('#main').innerHTML=heading('Usuarios y perfiles','Administra accesos con funciones diferenciadas.','<button id="adduser">Crear usuario</button>')+'<div class="panel">'+table(['Nombre y correo','Perfil','Estado','Acciones'],db.users.map(u=>`<tr><td><b>${esc(u.name)}</b><br><span class="muted tiny">${esc(u.email)}</span></td><td>${u.role}</td><td>${u.active?'Activo':'Bloqueado'}</td><td><div class="actions"><button class="secondary" data-edituser="${u.id}">Editar</button><button class="secondary" data-reset="${u.id}">Restablecer</button><button class="danger" data-toggleuser="${u.id}" ${u.id===session.id?'disabled':''}>${u.active?'Bloquear':'Activar'}</button></div></td></tr>`))+'</div>';$('#adduser').onclick=()=>editUser();document.querySelectorAll('[data-edituser]').forEach(b=>b.onclick=()=>editUser(+b.dataset.edituser));document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>resetPassword(+b.dataset.reset));document.querySelectorAll('[data-toggleuser]').forEach(b=>b.onclick=()=>{if(!allow('Administrador'))return;const u=user(+b.dataset.toggleuser);if(u.id===session.id)return;u.active=!u.active;log('Estado de usuario actualizado');render()})}
function editUser(id){const u=id?user(id):{name:'',email:'',role:'Estudiante'};modal(id?'Editar usuario':'Crear usuario',`<div class="field"><label for="name">Nombre</label><input id="name" value="${esc(u.name)}" required maxlength="70"></div><div class="field"><label for="newemail">Correo</label><input id="newemail" type="email" value="${esc(u.email)}" required></div><div class="field"><label for="role">Perfil</label><select id="role" ${id===session.id?'disabled':''}>${roles.map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select></div>${!id?'<div class="field"><label for="newpass">Contraseña temporal</label><input id="newpass" type="password" required minlength="8" maxlength="128"><p class="tiny muted">De 8 a 128 caracteres: mayúscula, minúscula, número y símbolo. Sin patrones comunes, datos personales ni nombres de perfiles. Se exigirá cambiarla al ingresar.</p></div>':''}`,async()=>{if(!allow('Administrador'))return;const email=$('#newemail').value.trim().toLowerCase(),name=$('#name').value.trim(),role=$('#role').value,p=!id&&$('#newpass').value;if(!name||db.users.some(x=>x.email===email&&x.id!==id))return tell('Revisa el nombre o el correo: puede estar duplicado.',true);if(!id){const error=await passwordError(p,{name,email,role});if(error)return tell(error,true);}Object.assign(u,{name,email,role});if(!id){u.id=uid();u.active=true;u.forceChange=true;await credential(u,p);db.users.push(u)}log('Usuario guardado');$('#modal').close();render();tell('Usuario guardado correctamente.')})}
function resetPassword(id){modal('Restablecer contraseña',`<p>Usuario: ${esc(user(id).email)}</p><div class="field"><label for="resetpass">Nueva contraseña temporal</label><input id="resetpass" type="password" minlength="8" maxlength="128" required></div><p class="tiny muted">${PASSWORD_HELP} Se exigirá cambiarla en el próximo inicio. La entrega de la clave se simula; en producción se usará un enlace de un solo uso.</p>`,async()=>{if(!allow('Administrador'))return;const p=$('#resetpass').value;const error=await passwordError(p,user(id));if(error)return tell(error,true);await credential(user(id),p);user(id).forceChange=true;delete attempts[user(id).email];log('Restablecimiento de contraseña');$('#modal').close();render();tell('Contraseña temporal actualizada.')})}
function password(){if(!session)return;$('#main').innerHTML=heading('Mi contraseña',session.forceChange?'Tu contraseña es temporal o ha vencido. Debes cambiarla para continuar.':'Protege el acceso a tu cuenta.')+`<form id="change" class="panel" style="max-width:620px"><div class="field"><label for="current">Contraseña actual</label><input id="current" type="password" required autocomplete="current-password"></div><div class="field"><label for="next">Nueva contraseña</label><input id="next" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></div><div class="field"><label for="repeat">Confirmar contraseña</label><input id="repeat" type="password" required autocomplete="new-password"></div><p class="muted tiny">${PASSWORD_HELP}</p><button>Actualizar contraseña</button></form>`;$('#change').onsubmit=async e=>{e.preventDefault();const p=$('#next').value;if(await hash($('#current').value,session.salt)!==session.hash)return tell('La contraseña actual no coincide.',true);if(p!==$('#repeat').value)return tell('La confirmación no coincide.',true);const error=await passwordError(p,session);if(error)return tell(error,true);await credential(session,p);session.forceChange=false;log('Contraseña actualizada');tell('Contraseña actualizada. Inicia sesión nuevamente.');login()}}
function reports(){if(!allow('Administrador'))return;const active=db.loans.filter(l=>!l.returned),overdue=active.filter(l=>l.due<day(0));$('#main').innerHTML=heading('Reportes de uso','Indicadores calculados a partir de la actividad de esta demostración.','<div class="actions"><button id="csv">Exportar CSV</button><button class="secondary" id="print">Imprimir / PDF</button></div>')+`<div class="grid"><div class="panel metric"><span>Préstamos activos</span><strong>${active.length}</strong></div><div class="panel metric"><span>Préstamos atrasados</span><strong>${overdue.length}</strong></div><div class="panel metric"><span>Usuarios con préstamos históricos</span><strong>${new Set(db.loans.map(l=>l.user)).size}</strong></div></div><div class="panel"><h2>Uso de la colección</h2>${table(['Material','Total de préstamos','Disponibles'],db.books.map(b=>`<tr><td>${esc(b.title)}</td><td>${db.loans.filter(l=>l.book===b.id).length}</td><td>${available(b.id)}</td></tr>`))}</div><p class="tiny muted">El CSV se puede abrir en Excel. El formato XLSX nativo queda fuera del mockup.</p>`;$('#print').onclick=()=>window.print();$('#csv').onclick=()=>{if(!allow('Administrador'))return;const cell=s=>'"'+String(s).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const csv='\ufeffMaterial;Prestamos;Disponibles\r\n'+db.books.map(b=>[b.title,db.loans.filter(l=>l.book===b.id).length,available(b.id)].map(cell).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='reporte_biblioteca.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);log('Reporte exportado')}}
function security(){if(!allow('Administrador'))return;$('#main').innerHTML=heading('Seguridad y auditoría','Controles demostrables y límites de esta versión local.')+'<div class="panel"><h2>Controles de la demostración</h2><p>Cinco intentos fallidos: bloqueo de 60 segundos. Sesión: cierre tras cinco minutos sin actividad. Contraseñas nuevas: 8–128 caracteres con mayúscula, minúscula, número y símbolo; rechazo de patrones comunes y datos personales. Historial de 3 hashes (incluye la clave actual); no se permite reutilizarlos. Cambio obligatorio de claves temporales y cada '+PASSWORD_MAX_DAYS+' días.</p><p>Las claves se transforman con PBKDF2, SHA-256 y sal aleatoria en memoria. Los datos desaparecen al recargar. El archivo incluye las credenciales públicas de demostración.</p><p><b>Producción pendiente:</b> autorización en servidor, HTTPS, base de datos cifrada, recuperación mediante token y auditoría persistente. El código de cliente puede manipularse y no es una barrera de seguridad real.</p></div><div class="panel"><h2>Registro de la sesión</h2>'+table(['Momento','Actor','Evento'],[...db.audit].reverse().map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.actor)}</td><td>${esc(a.event)}</td></tr>`))+'</div>'}
function help(){$('#main').innerHTML=heading('Ayuda para tu perfil','Una guía breve para completar las tareas principales.')+`<div class="panel help">${session.role==='Estudiante'?'<ol><li>En Catálogo, busca por título o autor y aplica filtros.</li><li>Selecciona Reservar material. Si no hay copias, ingresas a la espera.</li><li>En Mis préstamos y reservas, revisa si está Lista para retiro.</li><li>Retira el material con el bibliotecario y revisa su vencimiento.</li><li>Consulta las confirmaciones en Notificaciones.</li></ol>':session.role==='Bibliotecario'?'<ol><li>En Préstamos y devoluciones, revisa las reservas listas.</li><li>Valida la identidad del estudiante y pulsa Validar y prestar.</li><li>Usa Registrar préstamo para entregas sin reserva.</li><li>Al recibir el material, pulsa Devolver. La primera reserva en espera se habilita.</li><li>En Mantener catálogo, agrega, edita o da de baja materiales sin compromisos activos.</li></ol>':'<ol><li>Crea una cuenta en Usuarios y perfiles y asigna su rol.</li><li>Entrega la clave temporal de demostración; el usuario deberá cambiarla al ingresar.</li><li>Restablece claves o bloquea usuarios cuando corresponda.</li><li>Consulta Reportes de uso y exporta CSV o imprime a PDF.</li><li>Revisa el registro de eventos en Seguridad y auditoría.</li></ol>'}<p class="muted">Para reiniciar la demostración, recarga la página. Todos los cambios se perderán. No existe envío de correos ni conexión institucional.</p></div>`}
['click','keydown','pointerdown'].forEach(e=>document.addEventListener(e,()=>lastActivity=Date.now()));setInterval(()=>{if(session&&!session.forceChange&&passwordExpired(session)){session.forceChange=true;render()}if(session&&Date.now()-lastActivity>300000){$('#modal').close();log('Sesión expirada');login();tell('Sesión cerrada por inactividad.',true)}},1000);
async function boot(){try{for(const [i,role] of roles.entries()){const u={id:i+1,name:['Ana Estudiante','Diego Bibliotecario','Carla Administradora'][i],email:role.toLowerCase()+'@demo.cl',role,active:true,forceChange:false};await credential(u,DEMO);db.users.push(u)}db.loans.push({id:uid(),user:1,book:4,date:day(-16),due:day(-2),returned:null});notify(1,'Tienes un préstamo atrasado: Fundamentos de bases de datos. Acércate a la biblioteca.');login()}catch(e){$('#root').innerHTML='<main><h1>No se pudo iniciar el prototipo</h1><p>Abre el archivo en una versión reciente de Chrome o Edge que admita Web Crypto en archivos locales.</p></main>'}}
boot();
</script></body></html>
